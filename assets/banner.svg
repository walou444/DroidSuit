<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">DroidSuit</title>
  <desc id="desc">Espace mobile privé pour Android et iPhone sur Windows.</desc>
